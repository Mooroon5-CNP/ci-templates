# lang-go — lint or test one Go target (go.mod carries the version).
name: CNP lang-go
description: Setup Go from go.mod, then run go vet + gofmt (lint) or go test (test).

inputs:
  step:
    description: "lint or test"
    required: true
  path:
    description: Directory of the target (. for the repo root).
    required: false
    default: "."
  version:
    description: Go version. Default - read from go.mod.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check inputs
      shell: bash
      env:
        STEP: ${{ inputs.step }}
      run: |
        case "$STEP" in lint|test) ;; *) echo "::error::lang-go: step must be 'lint' or 'test' (got '$STEP')"; exit 1 ;; esac

    - uses: actions/setup-go@v5
      if: inputs.version == ''
      with:
        go-version-file: ${{ inputs.path }}/go.mod
        cache-dependency-path: ${{ inputs.path }}/go.mod

    - uses: actions/setup-go@v5
      if: inputs.version != ''
      with:
        go-version: ${{ inputs.version }}
        cache-dependency-path: ${{ inputs.path }}/go.mod

    - name: Lint (go vet + gofmt)
      if: inputs.step == 'lint'
      shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        go vet ./...
        unformatted=$(find . -name '*.go' -not -path './vendor/*' -print0 | xargs -0 gofmt -l)
        if [ -n "$unformatted" ]; then
          echo "::error title=gofmt::Files not gofmt-formatted (run 'gofmt -w .'): $(echo "$unformatted" | tr '\n' ' ')"
          exit 1
        fi

    - name: Test (go test)
      if: inputs.step == 'test'
      shell: bash
      working-directory: ${{ inputs.path }}
      run: go test ./...
