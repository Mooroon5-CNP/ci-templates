# .gitlab-ci.yml — Self-validation pipeline for the ci-templates repository.
#
# Two goals:
#   1. Prove this is an active GitLab CI project (required for the registry
#      and for other projects to reference it via include:project).
#   2. Catch YAML syntax errors and GitLab pipeline validation failures before
#      a broken template reaches consuming application pipelines.
#
# This file intentionally does NOT include pipeline.yml from itself — that
# file uses spec:inputs and requires consumer-supplied values that would make
# self-inclusion circular and impossible to satisfy here.

stages:
  - lint

# ---------------------------------------------------------------------------
# Job 1 — YAML syntax lint
# ---------------------------------------------------------------------------
lint-templates:
  stage: lint
  image:
    name: cytopia/yamllint:latest
    entrypoint: [""]
  script:
    - |
      yamllint \
        --config-file .yamllint.yml \
        pipeline.yml \
        templates/.lint.yml \
        templates/.test.yml \
        templates/.scan-secu.yml \
        templates/.build.yml \
        templates/.scan-image.yml \
        templates/.cleanup.yml \
        templates/.update-config.yml
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always

# ---------------------------------------------------------------------------
# Job 2 — GitLab CI schema validation (local, no API required)
# ---------------------------------------------------------------------------
# /api/v4/ci/lint and /api/v4/projects/:id/ci/lint are both gone in GitLab
# 17+. We validate locally against the official GitLab CI JSON schema
# published on SchemaStore. This catches unknown keywords, wrong value types,
# missing required fields, and invalid stage/image/rule structures without
# needing any network access to the GitLab API.
#
# pipeline.yml is a two-document YAML file:
#   Document 1 — spec:inputs  (GitLab component syntax, not in the CI schema)
#   Document 2 — pipeline body  (what we validate here)
# We extract document 2 into a temp file before running check-jsonschema.
#
# The schema is bundled with check-jsonschema >= 0.28 (vendor.gitlab-ci),
# so no network call is made at validation time.
validate-pipeline-syntax:
  stage: lint
  image: python:3.12-alpine
  before_script:
    - pip install --quiet pyyaml "check-jsonschema>=0.28"
  script:
    - |
      python3 -c "
      import yaml, sys
      with open('pipeline.yml') as f:
          docs = list(yaml.safe_load_all(f))
      if len(docs) < 2:
          print('ERROR: pipeline.yml must contain two YAML documents', file=sys.stderr)
          sys.exit(1)
      with open('/tmp/pipeline-body.yml', 'w') as out:
          yaml.dump(docs[-1], out, default_flow_style=False, allow_unicode=True)
      print(f'Extracted pipeline body ({len(docs)} documents found in pipeline.yml).')
      "

      check-jsonschema \
        --builtin-schema vendor.gitlab-ci \
        /tmp/pipeline-body.yml \
        templates/.lint.yml \
        templates/.test.yml \
        templates/.scan-secu.yml \
        templates/.build.yml \
        templates/.scan-image.yml \
        templates/.cleanup.yml \
        templates/.update-config.yml

      echo "All CI files passed GitLab CI schema validation."
  needs:
    - lint-templates
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
