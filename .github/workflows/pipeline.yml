# pipeline.yml — Reusable CI/CD pipeline for the CNP internal platform.
#
# Usage in any application repository:
#
#   jobs:
#     pipeline:
#       uses: Mooroon5-CNP/ci-templates/.github/workflows/pipeline.yml@main
#       with:
#         app_name: "my-app"
#         app_port: "3000"
#         target_cloud: "both"          # gcp | aws | both (default)
#         config_repo_url: "https://github.com/Mooroon5-CNP/config-repo"
#       secrets:
#         CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
#
# The calling workflow must grant:
#   permissions:
#     id-token: write   # required for OIDC token exchange with GCP WIF and AWS
#     contents: read

name: CNP Application Pipeline

on:
  workflow_call:
    inputs:
      app_name:
        type: string
        required: true
        description: "Application name — used as image name and Cloud Run claim directory"
      app_port:
        type: string
        required: false
        default: "8080"
        description: "Port the application listens on inside the container"
      config_repo_url:
        type: string
        required: true
        description: "HTTPS URL of the GitOps config repository"
      target_cloud:
        type: string
        required: false
        default: "both"
        description: "Target container registry: gcp | aws | both"
    secrets:
      CONFIG_REPO_TOKEN:
        required: true
        description: "PAT with write access to the config repository"

jobs:

  # ---------------------------------------------------------------------------
  # Stage: detect — figure out which language(s) the app uses, so lint/test
  # know which toolchain to run. Logic lives in the detect-stack action: it
  # scans every top-level directory (front/back, web/api, ...) for a language
  # marker file, falls back to the repo root for monoliths, and fails on a
  # directory that mixes several languages.
  #
  # Language-specific logic (setup, version, cache, lint, test) lives in one
  # action per language: .github/actions/lang-<x>. They are referenced by
  # remote path because `uses: ./...` would resolve inside the APP's repo, and
  # `uses:` cannot take an expression, hence one `if:` line per language.
  # Keep the @main ref in sync with the ref apps use for this workflow.
  #
  # To support an additional language: see "Adding a language" in the README.
  # ---------------------------------------------------------------------------

  detect-stack:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_targets: ${{ steps.detect.outputs.has_targets }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: detect
        uses: Mooroon5-CNP/ci-templates/.github/actions/detect-stack@main

  # ---------------------------------------------------------------------------
  # Stage: lint — parallel (one job per detected target, plus Dockerfile lint)
  # ---------------------------------------------------------------------------

  lint:
    runs-on: ubuntu-latest
    needs: [detect-stack]
    if: success() && needs.detect-stack.outputs.has_targets == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-stack.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Lint (node)
        if: matrix.lang == 'node'
        uses: Mooroon5-CNP/ci-templates/.github/actions/lang-node@main
        with:
          step: lint
          path: ${{ matrix.path }}

      - name: Lint (python)
        if: matrix.lang == 'python'
        uses: Mooroon5-CNP/ci-templates/.github/actions/lang-python@main
        with:
          step: lint
          path: ${{ matrix.path }}

      - name: Lint (go)
        if: matrix.lang == 'go'
        uses: Mooroon5-CNP/ci-templates/.github/actions/lang-go@main
        with:
          step: lint
          path: ${{ matrix.path }}

      - name: Lint (java)
        if: matrix.lang == 'java'
        uses: Mooroon5-CNP/ci-templates/.github/actions/lang-java@main
        with:
          step: lint
          path: ${{ matrix.path }}

      - name: Lint (cpp)
        if: matrix.lang == 'cpp'
        uses: Mooroon5-CNP/ci-templates/.github/actions/lang-cpp@main
        with:
          step: lint
          path: ${{ matrix.path }}

  lint-hadolint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: Mooroon5-CNP/ci-templates/.github/actions/dockerfile-lint@main

  # ---------------------------------------------------------------------------
  # Stage: test — parallel (one job per detected target)
  # ---------------------------------------------------------------------------

  test:
    runs-on: ubuntu-latest
    needs: [detect-stack, lint, lint-hadolint]
    if: success() && needs.detect-stack.outputs.has_targets == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-stack.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Test (node)
        if: matrix.lang == 'node'
        uses: Mooroon5-CNP/ci-templates/.github/actions/lang-node@main
        with:
          step: test
          path: ${{ matrix.path }}

      - name: Test (python)
        if: matrix.lang == 'python'
        uses: Mooroon5-CNP/ci-templates/.github/actions/lang-python@main
        with:
          step: test
          path: ${{ matrix.path }}

      - name: Test (go)
        if: matrix.lang == 'go'
        uses: Mooroon5-CNP/ci-templates/.github/actions/lang-go@main
        with:
          step: test
          path: ${{ matrix.path }}

      - name: Test (java)
        if: matrix.lang == 'java'
        uses: Mooroon5-CNP/ci-templates/.github/actions/lang-java@main
        with:
          step: test
          path: ${{ matrix.path }}

      - name: Test (cpp)
        if: matrix.lang == 'cpp'
        uses: Mooroon5-CNP/ci-templates/.github/actions/lang-cpp@main
        with:
          step: test
          path: ${{ matrix.path }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.name }}
          path: |
            ${{ matrix.path }}/test-results.xml
            ${{ matrix.path }}/target/surefire-reports/*.xml
            ${{ matrix.path }}/build/test-results/test/*.xml
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Stage: scan-secu — parallel
  # ---------------------------------------------------------------------------

  scan-secrets:
    runs-on: ubuntu-latest
    needs: [detect-stack, lint-hadolint, test]
    # Run when the tests passed, or when there was nothing to lint/test (no
    # recognized language): the Dockerfile is then the only contract and the
    # scans and build must still happen. A lint or test failure blocks them.
    if: >-
      ${{ !cancelled() && needs.detect-stack.result == 'success' &&
      (needs.test.result == 'success' ||
      (needs.detect-stack.outputs.has_targets == 'false' && needs.lint-hadolint.result == 'success')) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source="/repo" \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --redact \
            --verbose

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7

  scan-deps:
    runs-on: ubuntu-latest
    needs: [detect-stack, lint-hadolint, test]
    # Run when the tests passed, or when there was nothing to lint/test (no
    # recognized language): the Dockerfile is then the only contract and the
    # scans and build must still happen. A lint or test failure blocks them.
    if: >-
      ${{ !cancelled() && needs.detect-stack.result == 'success' &&
      (needs.test.result == 'success' ||
      (needs.detect-stack.outputs.has_targets == 'false' && needs.lint-hadolint.result == 'success')) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Scan deps — CRITICAL (blocking)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            aquasec/trivy:latest fs \
            --scanners vuln \
            --severity CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --format table \
            /workspace

      - name: Scan deps — HIGH/MEDIUM (non-blocking)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            aquasec/trivy:latest fs \
            --scanners vuln \
            --severity HIGH,MEDIUM \
            --exit-code 0 \
            --ignore-unfixed \
            --format table \
            /workspace || true

  # ---------------------------------------------------------------------------
  # Stage: build
  # ---------------------------------------------------------------------------

  build:
    runs-on: ubuntu-latest
    needs: [scan-secrets, scan-deps]
    # id-token: write lets the runner obtain a short-lived OIDC token from GitHub,
    # which google-github-actions/auth exchanges for a GCP access token via WIF,
    # and aws-actions/configure-aws-credentials exchanges for AWS STS credentials.
    # No long-lived key is stored anywhere.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        if: inputs.target_cloud != 'aws'
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
          token_format: access_token

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate Docker to Artifact Registry
        if: inputs.target_cloud != 'aws'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Authenticate to AWS via OIDC
        if: inputs.target_cloud != 'gcp'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::804210702561:role/github-ecr-push-role
          aws-region: eu-west-3

      - name: ECR login + ensure repo
        if: inputs.target_cloud != 'gcp'
        run: |
          aws ecr describe-repositories --repository-names "${{ inputs.app_name }}" --region eu-west-3 \
            || aws ecr create-repository --repository-name "${{ inputs.app_name }}" --region eu-west-3
          aws ecr get-login-password --region eu-west-3 \
            | docker login --username AWS --password-stdin "804210702561.dkr.ecr.eu-west-3.amazonaws.com"

      - name: Compute image refs
        run: |
          TARGET_CLOUD="${{ inputs.target_cloud }}"
          GCP_REGISTRY="${{ vars.REGISTRY_URL }}"
          ECR_REGISTRY="804210702561.dkr.ecr.eu-west-3.amazonaws.com"
          IMAGE_REF=""
          CACHE_REF=""
          ECR_REF=""
          tags=()

          if [ "$TARGET_CLOUD" != "aws" ]; then
            IMAGE_REF="${GCP_REGISTRY}/${{ inputs.app_name }}:${{ github.sha }}"
            CACHE_REF="${GCP_REGISTRY}/cache:${{ inputs.app_name }}"
            tags+=("$IMAGE_REF")
          fi

          if [ "$TARGET_CLOUD" != "gcp" ]; then
            ECR_REF="${ECR_REGISTRY}/${{ inputs.app_name }}:${{ github.sha }}"
            tags+=("$ECR_REF")
          fi

          {
            echo "IMAGE_REF=${IMAGE_REF}"
            echo "CACHE_REF=${CACHE_REF}"
            echo "ECR_REF=${ECR_REF}"
            echo "TAGS<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.TAGS }}
          build-args: APP_PORT=${{ inputs.app_port }}
          cache-from: ${{ env.CACHE_REF && format('type=registry,ref={0}', env.CACHE_REF) || '' }}
          cache-to: ${{ env.CACHE_REF && format('type=registry,ref={0},mode=max', env.CACHE_REF) || '' }}

  # ---------------------------------------------------------------------------
  # Stage: push — scan image
  # ---------------------------------------------------------------------------

  scan-image:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud via Workload Identity Federation
        if: inputs.target_cloud != 'aws'
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
          token_format: access_token

      - name: Authenticate Docker to Artifact Registry
        if: inputs.target_cloud != 'aws'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Authenticate to AWS via OIDC
        if: inputs.target_cloud != 'gcp'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::804210702561:role/github-ecr-push-role
          aws-region: eu-west-3

      - name: ECR login
        if: inputs.target_cloud != 'gcp'
        run: |
          aws ecr get-login-password --region eu-west-3 \
            | docker login --username AWS --password-stdin "804210702561.dkr.ecr.eu-west-3.amazonaws.com"

      - name: Compute scan ref
        run: |
          TARGET_CLOUD="${{ inputs.target_cloud }}"
          GCP_REGISTRY="${{ vars.REGISTRY_URL }}"
          ECR_REGISTRY="804210702561.dkr.ecr.eu-west-3.amazonaws.com"
          if [ "$TARGET_CLOUD" != "aws" ]; then
            SCAN_REF="${GCP_REGISTRY}/${{ inputs.app_name }}:${{ github.sha }}"
          else
            SCAN_REF="${ECR_REGISTRY}/${{ inputs.app_name }}:${{ github.sha }}"
          fi
          echo "SCAN_REF=${SCAN_REF}" >> "$GITHUB_ENV"

      - name: Pull image
        run: docker pull "$SCAN_REF"

      - name: Scan image
        uses: Mooroon5-CNP/ci-templates/.github/actions/image-scan@main
        with:
          image_ref: ${{ env.SCAN_REF }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Stage: push — cleanup on scan failure
  # ---------------------------------------------------------------------------

  cleanup-on-scan-failure:
    runs-on: ubuntu-latest
    needs: [scan-image]
    if: ${{ always() && needs.scan-image.result == 'failure' }}
    permissions:
      id-token: write
    steps:
      - name: Authenticate to Google Cloud via Workload Identity Federation
        if: inputs.target_cloud != 'aws'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Remove vulnerable image from Artifact Registry
        if: inputs.target_cloud != 'aws'
        env:
          APP_NAME: ${{ inputs.app_name }}
          TAG: ${{ github.sha }}
        run: |
          IMAGE="${{ vars.REGISTRY_URL }}/${APP_NAME}:${TAG}"
          echo "[cleanup] image to remove: ${IMAGE}"

          if gcloud artifacts docker images delete "${IMAGE}" --quiet; then
            echo "[cleanup] ${IMAGE} deleted"
          else
            echo "[cleanup] WARNING: delete returned non-zero — image may not exist or was already removed"
          fi

      - name: Authenticate to AWS via OIDC
        if: inputs.target_cloud != 'gcp'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::804210702561:role/github-ecr-push-role
          aws-region: eu-west-3

      - name: Remove vulnerable image from ECR
        if: inputs.target_cloud != 'gcp'
        run: |
          aws ecr batch-delete-image \
            --repository-name "${{ inputs.app_name }}" \
            --image-ids imageTag="${{ github.sha }}" \
            --region eu-west-3

  # ---------------------------------------------------------------------------
  # Stage: push — GitOps config update (dev, auto on main)
  # ---------------------------------------------------------------------------

  update-config-dev:
    runs-on: ubuntu-latest
    needs: [scan-image]
    if: ${{ github.ref == 'refs/heads/main' && needs.scan-image.result == 'success' && inputs.target_cloud != 'aws' }}
    permissions:
      contents: read
    steps:
      - name: Promote to dev
        env:
          CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
          CONFIG_REPO_URL: ${{ inputs.config_repo_url }}
          APP_NAME: ${{ inputs.app_name }}
          COMMIT_SHA: ${{ github.sha }}
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
        run: |
          for var in CONFIG_REPO_TOKEN COMMIT_SHA APP_NAME CONFIG_REPO_URL; do
            eval "val=\$$var"
            if [ -z "$val" ]; then
              echo "[update-config-dev] ERROR: required variable '$var' is not set" >&2
              exit 1
            fi
          done

          git config --global user.email "ci-bot@github.local"
          git config --global user.name "GitHub Actions Bot"

          AUTHED_URL="https://x-access-token:${CONFIG_REPO_TOKEN}@${CONFIG_REPO_URL#https://}"
          git clone --depth=1 "${AUTHED_URL}" config-repo
          cd config-repo

          # Update Kustomize overlay newTag for dev environment
          sed -i "s|newTag:.*|newTag: ${COMMIT_SHA}|" \
            "apps/${APP_NAME}/overlays/dev/kustomization.yaml"

          # Update Crossplane claim (if it exists)
          if [ -f "apps/${APP_NAME}/crossplane/cloudrun-claim.yaml" ]; then
            sed -i -E \
              "s|(${REGISTRY_URL}/${APP_NAME}):[^\"]*|\1:${COMMIT_SHA}|" \
              "apps/${APP_NAME}/crossplane/cloudrun-claim.yaml"
            # Datadog unified service tagging: DD_VERSION follows the image tag (CNP-037)
            sed -i "/name: DD_VERSION/{n;s|value:.*|value: \"${COMMIT_SHA}\"|}" \
              "apps/${APP_NAME}/crossplane/cloudrun-claim.yaml"
            git add "apps/${APP_NAME}/crossplane/cloudrun-claim.yaml"
          fi

          git add "apps/${APP_NAME}/overlays/dev/kustomization.yaml"
          git commit -m "chore(${APP_NAME}): promote ${COMMIT_SHA:0:7} to dev [ci skip]"

          for attempt in 1 2 3 4 5; do
            if git push "${AUTHED_URL}" HEAD:main; then echo "pushed (attempt $attempt)"; break; fi
            echo "push rejected, rebase + retry $attempt"
            git fetch "${AUTHED_URL}" main
            git rebase FETCH_HEAD || { git rebase --abort; echo "rebase conflict"; exit 1; }
            sleep $((RANDOM % 4 + 2))
            [ "$attempt" = "5" ] && { echo "push failed after 5 attempts"; exit 1; }
          done

  # ---------------------------------------------------------------------------
  # Stage: push — GitOps config update (prod, manual via environment protection)
  # ---------------------------------------------------------------------------

  update-config-prod:
    runs-on: ubuntu-latest
    needs: [scan-image]
    if: ${{ github.ref == 'refs/heads/prod' && needs.scan-image.result == 'success' && inputs.target_cloud != 'aws' }}
    environment: production
    permissions:
      contents: read
    steps:
      - name: Promote to prod
        env:
          CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
          CONFIG_REPO_URL: ${{ inputs.config_repo_url }}
          APP_NAME: ${{ inputs.app_name }}
          COMMIT_SHA: ${{ github.sha }}
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
        run: |
          for var in CONFIG_REPO_TOKEN COMMIT_SHA APP_NAME CONFIG_REPO_URL; do
            eval "val=\$$var"
            if [ -z "$val" ]; then
              echo "[update-config-prod] ERROR: required variable '$var' is not set" >&2
              exit 1
            fi
          done

          git config --global user.email "ci-bot@github.local"
          git config --global user.name "GitHub Actions Bot"

          AUTHED_URL="https://x-access-token:${CONFIG_REPO_TOKEN}@${CONFIG_REPO_URL#https://}"
          git clone --depth=1 "${AUTHED_URL}" config-repo
          cd config-repo

          # Update Kustomize overlay newTag for prod environment
          sed -i "s|newTag:.*|newTag: ${COMMIT_SHA}|" \
            "apps/${APP_NAME}/overlays/prod/kustomization.yaml"

          # Update Crossplane claim (if it exists)
          if [ -f "apps/${APP_NAME}/crossplane/cloudrun-claim.yaml" ]; then
            sed -i -E \
              "s|(${REGISTRY_URL}/${APP_NAME}):[^\"]*|\1:${COMMIT_SHA}|" \
              "apps/${APP_NAME}/crossplane/cloudrun-claim.yaml"
            # Datadog unified service tagging: DD_VERSION follows the image tag (CNP-037)
            sed -i "/name: DD_VERSION/{n;s|value:.*|value: \"${COMMIT_SHA}\"|}" \
              "apps/${APP_NAME}/crossplane/cloudrun-claim.yaml"
            git add "apps/${APP_NAME}/crossplane/cloudrun-claim.yaml"
          fi

          git add "apps/${APP_NAME}/overlays/prod/kustomization.yaml"
          git commit -m "chore(${APP_NAME}): promote ${COMMIT_SHA:0:7} to prod [ci skip]"

          git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
          git push "${AUTHED_URL}" HEAD

  # ---------------------------------------------------------------------------
  # Stage: push — GitOps config update (App Runner / AWS runtime)
  # ---------------------------------------------------------------------------

  update-config-aws:
    runs-on: ubuntu-latest
    needs: [scan-image]
    if: ${{ github.ref == 'refs/heads/main' && needs.scan-image.result == 'success' && inputs.target_cloud != 'gcp' }}
    permissions:
      contents: read
    steps:
      - name: Promote to ECS Fargate
        env:
          CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
          CONFIG_REPO_URL: ${{ inputs.config_repo_url }}
          APP_NAME: ${{ inputs.app_name }}
          COMMIT_SHA: ${{ github.sha }}
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
        run: |
          for var in CONFIG_REPO_TOKEN COMMIT_SHA APP_NAME CONFIG_REPO_URL; do
            eval "val=\$$var"
            if [ -z "$val" ]; then
              echo "[update-config-aws] ERROR: required variable '$var' is not set" >&2
              exit 1
            fi
          done

          git config --global user.email "ci-bot@github.local"
          git config --global user.name "GitHub Actions Bot"

          AUTHED_URL="https://x-access-token:${CONFIG_REPO_TOKEN}@${CONFIG_REPO_URL#https://}"
          git clone --depth=1 "${AUTHED_URL}" config-repo
          cd config-repo

          TASKDEF="apps/${APP_NAME}/crossplane/ecs-task-definition.yaml"
          SERVICE="apps/${APP_NAME}/crossplane/ecs-service.yaml"
          [ -f "$TASKDEF" ] || { echo "[update-config-aws] no ecs-task-definition.yaml, skip"; exit 0; }
          command -v yq >/dev/null || { echo "yq manquant"; exit 1; }

          NEW_NAME="${APP_NAME}-${COMMIT_SHA:0:7}"

          yq -i ".metadata.name = \"${NEW_NAME}\"" "$TASKDEF"
          sed -i -E "s|(dkr\.ecr\.eu-west-3\.amazonaws\.com/${APP_NAME}):[^\"[:space:]]*|\1:${COMMIT_SHA}|" "$TASKDEF"
          yq -i ".spec.forProvider.taskDefinitionRef.name = \"${NEW_NAME}\"" "$SERVICE"

          git add "$TASKDEF" "$SERVICE"
          git commit -m "chore(${APP_NAME}): promote ${COMMIT_SHA:0:7} to ECS Fargate [ci skip]"

          for attempt in 1 2 3 4 5; do
            if git push "${AUTHED_URL}" HEAD:main; then echo "pushed (attempt $attempt)"; break; fi
            echo "push rejected, rebase + retry $attempt"
            git fetch "${AUTHED_URL}" main
            git rebase FETCH_HEAD || { git rebase --abort; echo "rebase conflict"; exit 1; }
            sleep $((RANDOM % 4 + 2))
            [ "$attempt" = "5" ] && { echo "push failed after 5 attempts"; exit 1; }
          done
