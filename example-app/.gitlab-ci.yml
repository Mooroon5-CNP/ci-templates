# ============================================================================
# .gitlab-ci.yml — Copy this file into YOUR application repository.
#
# Quick start (5 steps):
#   1. Copy this file to the root of YOUR repo as .gitlab-ci.yml
#   2. Change app_name to your application name (must match k8s-config folder)
#   3. Change config_repo_url to the URL of your GitOps config repo
#   4. In GitLab: Settings → CI/CD → Variables → add CONFIG_REPO_TOKEN
#   5. Push to main — the pipeline starts automatically
#
# Full documentation: README.md in the ci-templates repo
# Working example with actual code: see test_app/ in ci-templates
# ============================================================================

# The pipeline only runs on these two branches.
# - main  → builds + deploys to dev automatically
# - prod  → builds + waits for a human to approve prod deployment
#
# Feature branches (feature/*, fix/*) do NOT trigger this pipeline.
# Add your own lightweight checks for those if needed.
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "prod"'

include:
  - project: 'nazim.lameche/ci-templates' # Change this
    # ─── IMPORTANT ─────────────────────────────────────────────────────────
    # In production, pin this to a release tag to avoid surprises:
    #   ref: v1.0.0
    # Using ref: main means you always get the latest version of the template,
    # which could introduce changes without warning.
    # ───────────────────────────────────────────────────────────────────────
    ref: main
    file: 'pipeline.yml'
    inputs:
      # ── app_name ──────────────────────────────────────────────────────────
      # The name of your application.
      # This value is used in three places:
      #   1. The Docker image name in the registry:
      #      registry.gitlab.com/your-org/your-repo/<app_name>:<sha>
      #   2. The Kustomize overlay path in the config repo:
      #      k8s-config/apps/<app_name>/overlays/dev|prod/
      #   3. The git commit message when promoting to dev/prod.
      #
      # Use lowercase letters, numbers, and hyphens only. No spaces.
      # Example: "my-api", "auth-service", "data-processor"
      app_name: "example-app"   # ← CHANGE THIS

      # ── app_port ──────────────────────────────────────────────────────────
      # The TCP port your application listens on inside the container.
      # Must match:
      #   - The EXPOSE instruction in your Dockerfile
      #   - The port.containerPort in your Kubernetes Deployment manifest
      #   - The port your Express app calls app.listen() on
      #
      # Default is 8080 if not specified. Most apps use 3000 or 8080.
      app_port: "8080" # Change this if your app listens on a different port

      # ── config_repo_url ───────────────────────────────────────────────────
      # The HTTPS URL of the GitOps repository that ArgoCD watches.
      # This is the repo that contains your Kubernetes manifests (Kustomize).
      # It is a DIFFERENT repo from your application code repo.
      #
      # The pipeline will clone this repo, update the image tag, and push.
      # ArgoCD then detects the tag change and deploys the new image.
      #
      # Format: https://gitlab.example.com/your-org/k8s-config.git
      # The repo must have write access via CONFIG_REPO_TOKEN (see README.md)
      config_repo_url: "https://gitlab.example.com/platform/k8s-config.git"  # ← CHANGE THIS

# ============================================================================
# WHAT HAPPENS NEXT?
#
# On push to main, this pipeline will run these stages in order:
#
#   lint        → ESLint checks your JS code
#               → Hadolint checks your Dockerfile
#
#   test        → npm test runs your test suite
#
#   scan-secu   → Gitleaks scans for secrets in your git history
#               → Trivy scans your npm deps for known CVEs
#                 (CRITICAL = pipeline fails, HIGH/MEDIUM = warning only)
#
#   build       → BuildKit builds your Docker image and pushes it to
#                 GitLab Container Registry with a commit SHA tag
#
#   push        → Trivy scans the built image
#               → If scan passes: updates newTag in overlays/dev/
#                 ArgoCD deploys to dev automatically
#               → If scan fails: image is deleted from registry
#
# On push to prod (via MR from main → prod):
#   Same as above, but the final step (overlays/prod update) waits for
#   a human to click "Run" in the GitLab pipeline UI.
#
# ── REQUIREMENTS FOR THIS PIPELINE TO WORK ───────────────────────────────
#
# Your application repo must have:
#   □ Dockerfile          using node:20-alpine as base image
#   □ package.json        with "lint" and "test" scripts
#   □ package-lock.json   committed (run: npm install)
#   □ /healthz endpoint   returning HTTP 200
#   □ /ready endpoint     returning HTTP 200
#
# GitLab must have:
#   □ CONFIG_REPO_TOKEN   set in Settings → CI/CD → Variables
#   □ A runner with tag   [dind] (ask the platform team)
#
# The GitOps config repo must have:
#   □ apps/<app_name>/overlays/dev/kustomization.yaml  (with a newTag: line)
#   □ apps/<app_name>/overlays/prod/kustomization.yaml (with a newTag: line)
#
# See README.md for details on all of the above.
# ============================================================================
