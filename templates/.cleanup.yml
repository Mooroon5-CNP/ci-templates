# .cleanup.yml — Delete the pushed image tag from the GitLab Container Registry
# when a vulnerability scan fails (stage: push).
#
# Flow: build pushes → scan-image fails → cleanup triggers → image deleted.
#
# Why delete? The image is already in the registry (BuildKit pushed it during
# the build stage) but it must not be deployed. Leaving a vulnerable image
# silently in the registry would allow accidental promotion. Deletion is the
# safest default; teams that prefer quarantine can override this job.
#
# The GitLab Container Registry API requires the numeric repository ID, derived
# here via two API calls: list repositories → find matching name → get ID →
# delete tag.
#
# Authentication uses CI_JOB_TOKEN (scoped to the current project, no extra
# configuration needed). The token is valid only for the duration of the job.

.cleanup:
  stage: push
  image: alpine:3.19
  variables:
    GITLAB_API: ${CI_SERVER_URL}/api/v4
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      echo "[cleanup] image to remove: ${IMAGE_REF}"

      # Step 1: resolve the numeric repository ID for this image name.
      REPO_ID=$(
        curl --silent --fail \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${GITLAB_API}/projects/${CI_PROJECT_ID}/registry/repositories" \
          | jq --arg name "${APP_NAME}" \
               '.[] | select(.name == $name) | .id' \
          | head -1
      )

      if [ -z "$REPO_ID" ]; then
        echo "[cleanup] WARNING: could not find repository '${APP_NAME}' in registry — nothing to delete" >&2
        exit 0
      fi

      # Step 2: delete the specific tag (the short SHA).
      HTTP_STATUS=$(
        curl --silent --output /dev/null --write-out "%{http_code}" \
          --request DELETE \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${GITLAB_API}/projects/${CI_PROJECT_ID}/registry/repositories/${REPO_ID}/tags/${CI_COMMIT_SHORT_SHA}"
      )

      case "$HTTP_STATUS" in
        200|204)
          echo "[cleanup] tag ${CI_COMMIT_SHORT_SHA} deleted from repository ${REPO_ID}" ;;
        404)
          echo "[cleanup] tag not found — already removed or never pushed" ;;
        *)
          echo "[cleanup] ERROR: unexpected HTTP ${HTTP_STATUS} from registry API" >&2
          exit 1 ;;
      esac
  needs:
    - job: scan-image
      optional: true
  when: on_failure
  allow_failure: true
