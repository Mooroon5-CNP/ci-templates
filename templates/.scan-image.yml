# .scan-image.yml — Trivy vulnerability scan on the built image (stage: push).
#
# Runs AFTER the build job (the image is already pushed to the registry by
# BuildKit). Trivy must pull the image to inspect it.
#
# Blocking rules (CNP contracts):
#   CRITICAL  → pipeline fails, cleanup-on-scan-failure removes the image.
#   HIGH/MEDIUM → non-blocking warning printed to job log.
#
# The Trivy DB is cached (key: trivy-db) and shared with scan-deps so the
# ~200 MB database is only downloaded once per project.

.scan-image:
  stage: push
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    IMAGE_REF: $CI_REGISTRY_IMAGE/$[[ inputs.app_name ]]:$CI_COMMIT_SHORT_SHA
    TRIVY_CACHE_DIR: .trivy-cache
    TRIVY_NO_PROGRESS: "false"
  cache:
    key: trivy-db
    paths:
      - .trivy-cache/
    policy: pull-push
  before_script:
    - |
      trivy registry login \
        --username "$CI_REGISTRY_USER" \
        --password "$CI_REGISTRY_PASSWORD" \
        "$CI_REGISTRY"
  script:
    - |
      echo "[scan-image] Scanning ${IMAGE_REF} for CRITICAL vulnerabilities..."
      trivy image \
        --cache-dir "${TRIVY_CACHE_DIR}" \
        --severity CRITICAL \
        --exit-code 1 \
        --ignore-unfixed \
        --format table \
        --output trivy-report.txt \
        "${IMAGE_REF}"
      cat trivy-report.txt

      echo "[scan-image] Scanning for HIGH/MEDIUM vulnerabilities (non-blocking)..."
      trivy image \
        --cache-dir "${TRIVY_CACHE_DIR}" \
        --severity HIGH,MEDIUM \
        --exit-code 0 \
        --ignore-unfixed \
        --format table \
        "${IMAGE_REF}" || true
  needs:
    - job: build
  artifacts:
    when: always
    paths:
      - trivy-report.txt
    expire_in: 7 days
