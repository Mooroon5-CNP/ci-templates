# .build.yml — Kaniko image build and push to GitLab Container Registry.
#
# Kaniko builds Docker images entirely inside the container — no Docker daemon,
# no privileged mode, no user namespaces. Works on any standard GitLab runner
# with the docker executor (including shared runners).

.build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    # Override entrypoint so GitLab can inject its own before_script wrapper.
    entrypoint: [""]
  variables:
    APP_NAME: $[[ inputs.app_name ]]
    APP_PORT: $[[ inputs.app_port ]]
    IMAGE_REF: $CI_REGISTRY_IMAGE/$[[ inputs.app_name ]]:$CI_COMMIT_SHORT_SHA
    CACHE_REF: $CI_REGISTRY_IMAGE/cache:$[[ inputs.app_name ]]
  before_script:
    # Fail fast if any required GitLab variable is missing.
    - |
      for var in CI_REGISTRY CI_REGISTRY_USER CI_REGISTRY_PASSWORD CI_REGISTRY_IMAGE CI_COMMIT_SHORT_SHA; do
        eval "val=\$$var"
        if [ -z "$val" ]; then
          echo "[build] ERROR: required variable '$var' is not set or empty" >&2
          exit 1
        fi
      done
    # Provide registry credentials to Kaniko.
    - mkdir -p /kaniko/.docker
    - |
      printf '{"auths":{"%s":{"auth":"%s"}}}' \
        "$CI_REGISTRY" \
        "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')" \
        > /kaniko/.docker/config.json
  script:
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --destination "${IMAGE_REF}" \
        --build-arg APP_PORT="${APP_PORT}" \
        --cache=true \
        --cache-repo="${CACHE_REF}"
    - echo "[build] pushed ${IMAGE_REF}"
