# pipeline.yml — Reusable CI pipeline template for the internal developer platform.
#
# Consume this template from any application repository:
#
#   include:
#     - project: 'platform/ci-templates'
#       ref: main
#       file: 'pipeline.yml'
#
#   workflow:
#     rules:
#       - if: '$CI_COMMIT_BRANCH == "main"'
#       - if: '$CI_COMMIT_BRANCH == "prod"'
#
#   variables:
#     # Override any spec:inputs default here if needed.
#     TRIVY_SEVERITY: "HIGH,CRITICAL"

spec:
  inputs:
    # Name of the application; used as the image repository name and overlay path.
    app_name:
      type: string
      description: "Application name (used as image name and Kustomize overlay directory)"

    # Container port exposed by the application image.
    app_port:
      type: string
      default: "8080"
      description: "Port the application listens on inside the container"

    # HTTPS URL of the GitLab config repository that ArgoCD watches.
    # Example: https://gitlab.example.com/platform/k8s-config.git
    config_repo_url:
      type: string
      description: "HTTPS URL of the GitOps config repository"

    # Trivy exit-code severity threshold. Comma-separated list.
    # CRITICAL blocks the pipeline; HIGH,CRITICAL also blocks on HIGH findings.
    trivy_severity:
      type: string
      default: "CRITICAL"
      description: "Trivy severity levels that cause pipeline failure"

---

# Global default job configuration inherited by every job in the pipeline.
default:
  retry:
    max: 2
    # Only retry on infrastructure failures (runner crash, network timeout),
    # not on script failures which indicate a real problem.
    when: runner_system_failure

stages:
  - scan-secrets
  - build
  - scan-image
  - cleanup
  - update-config
# ---------------------------------------------------------------------------
# Template includes — each file defines a hidden job (prefixed with a dot)
# that concrete jobs extend below.
# ---------------------------------------------------------------------------
include:
  - local: templates/.scan-secrets.yml
  - local: templates/.build.yml
  - local: templates/.scan-image.yml
  - local: templates/.cleanup.yml
  - local: templates/.update-config.yml

# ---------------------------------------------------------------------------
# Concrete jobs — extend the hidden templates and bind them to this pipeline.
# ---------------------------------------------------------------------------

scan-secrets:
  extends: .scan-secrets

build:
  extends: .build

scan-image:
  extends: .scan-image
  # Override the artifact output path to include the report content in the
  # Trivy table format so it appears in the job log as well.
  script:
    - |
      trivy image \
        --cache-dir "${TRIVY_CACHE_DIR}" \
        --severity "${TRIVY_SEVERITY}" \
        --exit-code 1 \
        --ignore-unfixed \
        --format table \
        --output trivy-report.txt \
        "${IMAGE_REF}"
      cat trivy-report.txt

cleanup-on-scan-failure:
  extends: .cleanup

update-config-dev:
  extends: .update-config-dev

update-config-prod:
  extends: .update-config-prod
