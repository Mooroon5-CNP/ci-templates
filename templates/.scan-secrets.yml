# .scan-secrets.yml — Gitleaks secret scan on source code.
#
# Runs in the scan-secrets stage, which executes BEFORE the build stage, so a
# secret accidentally committed never reaches the container image or the registry.
#
# Exit code semantics for gitleaks detect:
#   0 — no leaks found
#   1 — leaks found  (pipeline blocked)
#   126/127 — binary execution error

.scan-secrets:
  stage: scan-secrets
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  variables:
    # Write the SARIF report as an artifact so findings are visible in the
    # GitLab Security Dashboard (requires Ultimate tier); harmless otherwise.
    GITLEAKS_REPORT: gitleaks-report.json
  script:
    - |
      gitleaks detect \
        --source="$CI_PROJECT_DIR" \
        --report-format=json \
        --report-path="${GITLEAKS_REPORT}" \
        --redact \
        --verbose
  artifacts:
    # Always upload the report so failed pipelines still expose findings.
    when: always
    paths:
      - $GITLEAKS_REPORT
    expire_in: 7 days
  rules:
    # Run on every push; there is no branch restriction because secrets can be
    # committed on any branch and must be caught early.
    - when: always
