# .lint.yml — Code quality and Dockerfile linting (stage: lint).
#
# Two parallel jobs:
#   lint-eslint    — ESLint on the Node.js source code.
#                    Requires the consuming app to define a `lint` script in
#                    package.json (e.g. "lint": "eslint . --ext .js,.mjs").
#   lint-hadolint  — Hadolint on the Dockerfile.
#                    Catches bad practices: non-pinned tags, root user,
#                    missing HEALTHCHECK, etc.
#
# Both jobs share the same node_modules cache key so the install only
# happens once when lint and test run close together.

.lint-eslint:
  stage: lint
  image: node:20-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: pull-push
  before_script:
    - |
      if [ ! -f package-lock.json ]; then
        echo "[lint-eslint] ERROR: package-lock.json not found." >&2
        echo "[lint-eslint] Run 'npm install' locally and commit the lockfile." >&2
        exit 1
      fi
    - npm ci --prefer-offline
  script:
    - |
      if ! npm run lint -- --help > /dev/null 2>&1; then
        if ! npx --no-install eslint --version > /dev/null 2>&1; then
          echo "[lint-eslint] ERROR: 'eslint' not found in node_modules." >&2
          echo "[lint-eslint] Add eslint to devDependencies and define a 'lint' script in package.json." >&2
          exit 1
        fi
      fi
      npm run lint
  rules:
    - when: always

.lint-hadolint:
  stage: lint
  image:
    name: hadolint/hadolint:latest-alpine
    entrypoint: [""]
  script:
    - |
      if [ ! -f Dockerfile ]; then
        echo "[lint-hadolint] ERROR: Dockerfile not found at repository root." >&2
        exit 1
      fi
      hadolint Dockerfile
  rules:
    - when: always
