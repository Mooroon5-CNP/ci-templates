# pipeline.yml — Reusable CI pipeline template for the CNP internal platform.
#
# Usage in any application repository:
#
#   include:
#     - project: 'platform/ci-templates'
#       ref: main          # pin to a release tag in production (e.g. ref: v1.0.0)
#       file: 'pipeline.yml'
#       inputs:
#         app_name: "my-app"
#         app_port: "3000"
#         config_repo_url: "https://gitlab.example.com/platform/k8s-config.git"
#
#   workflow:
#     rules:
#       - if: '$CI_COMMIT_BRANCH == "main"'
#       - if: '$CI_COMMIT_BRANCH == "prod"'

spec:
  inputs:
    # Application name. Must match:
    #   - the image repository name in the GitLab Container Registry
    #   - the directory under k8s-config/apps/<app_name>/overlays/{dev,prod}/
    app_name:
      type: string
      description: "Application name (used as image name and Kustomize overlay directory)"

    # TCP port exposed by the container. Passed as a build-arg so BuildKit
    # can set it without hard-coding it in the Dockerfile.
    app_port:
      type: string
      default: "8080"
      description: "Port the application listens on inside the container"

    # HTTPS URL of the GitLab config repository that ArgoCD watches.
    # Example: https://gitlab.example.com/platform/k8s-config.git
    config_repo_url:
      type: string
      description: "HTTPS URL of the GitOps config repository"

---

# ---------------------------------------------------------------------------
# Global defaults — inherited by every job in the pipeline.
# ---------------------------------------------------------------------------
default:
  retry:
    max: 2
    # Retry only on infrastructure failures (runner crash, network timeout).
    # Script failures indicate a real problem and must not be retried.
    when: runner_system_failure

# ---------------------------------------------------------------------------
# Stages — ordered exactly as defined in the CNP contracts.
# ---------------------------------------------------------------------------
stages:
  - lint        # ESLint + Hadolint Dockerfile check
  - test        # npm test
  - scan-secu   # Gitleaks secret scan + Trivy dependency scan
  - build       # BuildKit rootless image build + push to GitLab CR
  - push        # Trivy image scan + cleanup on failure + GitOps promotion

# ---------------------------------------------------------------------------
# Template includes — each file defines hidden jobs (prefixed with a dot)
# that the concrete jobs below extend.
# ---------------------------------------------------------------------------
include:
  - local: templates/.lint.yml
  - local: templates/.test.yml
  - local: templates/.scan-secu.yml
  - local: templates/.build.yml
  - local: templates/.scan-image.yml
  - local: templates/.cleanup.yml
  - local: templates/.update-config.yml

# ---------------------------------------------------------------------------
# Concrete jobs
# ---------------------------------------------------------------------------

# — lint stage —

lint-eslint:
  extends: .lint-eslint

lint-hadolint:
  extends: .lint-hadolint

# — test stage —

test:
  extends: .test

# — scan-secu stage —

scan-secrets:
  extends: .scan-secrets

scan-deps:
  extends: .scan-deps

# — build stage —

build:
  extends: .build

# — push stage —

scan-image:
  extends: .scan-image

cleanup-on-scan-failure:
  extends: .cleanup

update-config-dev:
  extends: .update-config-dev

update-config-prod:
  extends: .update-config-prod
