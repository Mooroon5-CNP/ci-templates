# pipeline-azure.yml — Pipeline CI/CD réutilisable du tier « souveraineté » (Azure, UE) de la plateforme CNP.
#
# La plateforme propose deux choix EXCLUSIFS à l'onboarding :
#   - résilience + failover : AWS + GCP  -> pipeline.yml
#   - souveraineté          : Azure      -> ce fichier
# Les deux pipelines sont donc séparés : pipeline.yml n'est pas touché, une régression ici ne peut pas
# casser les builds GCP/AWS.
#
# Usage dans le dépôt d'une application :
#
#   jobs:
#     pipeline:
#       uses: Mooroon5-CNP/ci-templates/.github/workflows/pipeline-azure.yml@main
#       with:
#         app_name: "my-app"
#         app_port: "3000"
#         config_repo_url: "https://github.com/Mooroon5-CNP/config-repo"
#       secrets:
#         CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
#
# Le workflow appelant doit accorder :
#   permissions:
#     id-token: write   # échange du jeton OIDC GitHub contre un jeton Azure (azure/login), sans secret
#     contents: read
#
# Variables du dépôt ou de l'organisation (pas des secrets ; valeurs : sorties Terraform de azure/) :
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID  identité de la CI (azure/12-ci-identity.tf)
#   AZURE_ACR_LOGIN_SERVER                                    registre de la France, ex. cnpsovfr….azurecr.io
# Le dépôt de l'app doit aussi figurer dans var.ci_github_repos (azure/0-variables.tf) : Entra ne valide
# que les dépôts et branches listés (main et prod).
#
# Les étapes de contrôle (detect-stack, lint, test, scans de secrets et de dépendances) sont COPIÉES de
# pipeline.yml, qui reste la référence : les répercuter ici quand elles changent. Dette : les sortir dans
# un workflow commun appelé par les deux pipelines.

name: CNP Application Pipeline (Azure)

on:
  workflow_call:
    inputs:
      app_name:
        type: string
        required: true
        description: "Nom de l'application — nom de l'image et du répertoire de claims"
      app_port:
        type: string
        required: false
        default: "8080"
        description: "Port d'écoute de l'application dans le conteneur"
      config_repo_url:
        type: string
        required: true
        description: "URL HTTPS du dépôt GitOps (config-repo)"
    secrets:
      CONFIG_REPO_TOKEN:
        required: true
        description: "PAT avec droit d'écriture sur le config-repo"

jobs:

  # ---------------------------------------------------------------------------
  # Stage: detect — figure out which language(s) the app uses, so lint/test
  # know which toolchain to run. Scans every top-level directory (whatever
  # it's named — front/back, client/server, web/api, ...) and keeps the ones
  # that contain a recognized language marker file. If no subdirectory
  # qualifies, falls back to detecting at the repo root instead — this keeps
  # every currently onboarded app (cnp-portal, exemple-app-cnp, etc., all
  # root-level Node today) working unchanged. Only one level deep is scanned
  # (a nested path like apps/web/ won't be picked up on its own).
  #
  # To support an additional language: add one more `elif` branch in
  # detect_lang() below, plus the matching setup/lint/test steps in the
  # "lint" and "test" jobs (search for the language name, e.g. "python").
  # ---------------------------------------------------------------------------

  detect-stack:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: detect
        run: |
          detect_lang() {
            local dir="$1"
            if   [ -f "$dir/package.json" ]; then echo "node"
            elif [ -f "$dir/requirements.txt" ] || [ -f "$dir/pyproject.toml" ]; then echo "python"
            elif [ -f "$dir/go.mod" ]; then echo "go"
            elif [ -f "$dir/pom.xml" ] || [ -f "$dir/build.gradle" ] || [ -f "$dir/build.gradle.kts" ]; then echo "java"
            elif [ -f "$dir/CMakeLists.txt" ]; then echo "cpp"
            else echo ""
            fi
          }

          targets="[]"
          add_target() {
            local path="$1" name="$2" lang="$3"
            targets=$(echo "$targets" | jq -c --arg path "$path" --arg name "$name" --arg lang "$lang" \
              '. + [{"path":$path,"name":$name,"lang":$lang}]')
          }

          # Directories that are never an app's own source root, regardless
          # of language — skip them so they can't be mistaken for a target.
          EXCLUDE_DIRS=".git .github node_modules venv .venv __pycache__ dist build target vendor .idea .vscode"
          is_excluded() {
            local dir="$1"
            for ex in $EXCLUDE_DIRS; do
              [ "$dir" = "$ex" ] && return 0
            done
            return 1
          }

          for entry in */; do
            dir="${entry%/}"
            is_excluded "$dir" && continue
            lang=$(detect_lang "$dir")
            [ -n "$lang" ] && add_target "$dir" "$dir" "$lang"
          done

          # No recognized subdirectory anywhere — this is a monolith (or an
          # unrecognized layout), so check the repo root itself instead.
          if [ "$targets" = "[]" ]; then
            root_lang=$(detect_lang .)
            if [ -n "$root_lang" ]; then
              add_target "." "root" "$root_lang"
            else
              echo "::warning::No recognized language found anywhere in the repo (checked top-level directories and repo root) — lint/test will be skipped."
            fi
          fi

          echo "Detected targets: $targets"
          echo "matrix={\"include\":$targets}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Stage: lint — parallel (one job per detected target, plus Dockerfile lint)
  # ---------------------------------------------------------------------------

  lint:
    runs-on: ubuntu-latest
    needs: [detect-stack]
    if: success() && needs.detect-stack.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-stack.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        if: matrix.lang == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Setup Python
        if: matrix.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        if: matrix.lang == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Java
        if: matrix.lang == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Lint (node — ESLint)
        if: matrix.lang == 'node'
        working-directory: ${{ matrix.path }}
        run: |
          if [ ! -f package-lock.json ]; then
            echo "[lint:${{ matrix.name }}] ERROR: package-lock.json not found." >&2
            echo "[lint:${{ matrix.name }}] Run 'npm install' locally and commit the lockfile." >&2
            exit 1
          fi
          npm ci --prefer-offline
          if ! npm run lint -- --help > /dev/null 2>&1; then
            if ! npx --no-install eslint --version > /dev/null 2>&1; then
              echo "[lint:${{ matrix.name }}] ERROR: eslint not found in node_modules." >&2
              exit 1
            fi
          fi
          npm run lint

      - name: Lint (python — flake8)
        if: matrix.lang == 'python'
        working-directory: ${{ matrix.path }}
        run: |
          pip install --quiet flake8
          flake8 .

      - name: Lint (go — go vet)
        if: matrix.lang == 'go'
        working-directory: ${{ matrix.path }}
        run: go vet ./...

      - name: Lint (java — Maven compile)
        if: matrix.lang == 'java' && hashFiles(format('{0}/pom.xml', matrix.path)) != ''
        working-directory: ${{ matrix.path }}
        run: mvn -q -B compile

      - name: Lint (java — Gradle compile)
        if: matrix.lang == 'java' && hashFiles(format('{0}/pom.xml', matrix.path)) == ''
        working-directory: ${{ matrix.path }}
        run: |
          chmod +x ./gradlew
          ./gradlew compileJava

      - name: Lint (cpp — cppcheck)
        if: matrix.lang == 'cpp'
        working-directory: ${{ matrix.path }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck
          cppcheck --error-exitcode=1 --quiet .

  lint-hadolint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        run: |
          if [ ! -f Dockerfile ]; then
            echo "[lint-hadolint] ERROR: Dockerfile not found at repository root." >&2
            exit 1
          fi
          # Pinned on purpose: a floating tag (latest-alpine) lets upstream
          # releases add new rules and break every app's CI overnight with no
          # change on our side (v2.15.0 started flagging shell-form
          # HEALTHCHECK CMD as DL3025). Bump this deliberately, in its own PR.
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            hadolint/hadolint:v2.14.0-alpine \
            hadolint Dockerfile

  # ---------------------------------------------------------------------------
  # Stage: test — parallel (one job per detected target)
  # ---------------------------------------------------------------------------

  test:
    runs-on: ubuntu-latest
    needs: [detect-stack, lint, lint-hadolint]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-stack.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        if: matrix.lang == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Setup Python
        if: matrix.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        if: matrix.lang == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Java
        if: matrix.lang == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Test (node)
        if: matrix.lang == 'node'
        working-directory: ${{ matrix.path }}
        run: |
          npm ci --prefer-offline
          npm test

      - name: Test (python)
        if: matrix.lang == 'python'
        working-directory: ${{ matrix.path }}
        run: |
          [ -f requirements.txt ] && pip install --quiet -r requirements.txt
          pip install --quiet pytest
          pytest --junitxml=test-results.xml

      - name: Test (go)
        if: matrix.lang == 'go'
        working-directory: ${{ matrix.path }}
        run: go test ./...

      - name: Test (java — Maven)
        if: matrix.lang == 'java' && hashFiles(format('{0}/pom.xml', matrix.path)) != ''
        working-directory: ${{ matrix.path }}
        run: mvn -q -B test

      - name: Test (java — Gradle)
        if: matrix.lang == 'java' && hashFiles(format('{0}/pom.xml', matrix.path)) == ''
        working-directory: ${{ matrix.path }}
        run: |
          chmod +x ./gradlew
          ./gradlew test

      - name: Test (cpp — CMake + CTest)
        if: matrix.lang == 'cpp'
        working-directory: ${{ matrix.path }}
        run: |
          cmake -B build
          cmake --build build
          ctest --test-dir build --output-on-failure

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.name }}
          path: ${{ matrix.path }}/test-results.xml
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Stage: scan-secu — parallel
  # ---------------------------------------------------------------------------

  scan-secrets:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source="/repo" \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --redact \
            --verbose

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7

  scan-deps:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Scan deps — CRITICAL (blocking)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            aquasec/trivy:latest fs \
            --scanners vuln \
            --severity CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --format table \
            /workspace

      - name: Scan deps — HIGH/MEDIUM (non-blocking)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            aquasec/trivy:latest fs \
            --scanners vuln \
            --severity HIGH,MEDIUM \
            --exit-code 0 \
            --ignore-unfixed \
            --format table \
            /workspace || true


  # ---------------------------------------------------------------------------
  # Stage: build — construit l'image et la pousse dans l'ACR de la France.
  # id-token: write permet d'obtenir un jeton OIDC GitHub de courte durée, qu'azure/login échange
  # contre un jeton Azure (identité cnp-sov-ci-id). Aucune clé n'est stockée.
  # ---------------------------------------------------------------------------

  build:
    runs-on: ubuntu-latest
    needs: [scan-secrets, scan-deps]
    permissions:
      contents: read
      id-token: write
    env:
      ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Azure configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          for var in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID ACR_LOGIN_SERVER; do
            eval "val=\$$var"
            if [ -z "$val" ]; then
              echo "[build] ERROR: la variable GitHub '$var' (ou AZURE_ACR_LOGIN_SERVER) n'est pas définie" >&2
              exit 1
            fi
          done

      - name: Authenticate to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get an ACR token
        id: acr
        run: |
          TOKEN=$(az acr login --name "${ACR_LOGIN_SERVER%%.*}" --expose-token --output tsv --query accessToken)
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate Docker to the Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
          username: 00000000-0000-0000-0000-000000000000
          password: ${{ steps.acr.outputs.token }}

      - name: Compute image refs
        run: |
          {
            echo "IMAGE_REF=${ACR_LOGIN_SERVER}/${{ inputs.app_name }}:${{ github.sha }}"
            echo "CACHE_REF=${ACR_LOGIN_SERVER}/cache:${{ inputs.app_name }}"
          } >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REF }}
          build-args: APP_PORT=${{ inputs.app_port }}
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          cache-to: type=registry,ref=${{ env.CACHE_REF }},mode=max

  # ---------------------------------------------------------------------------
  # Stage: push — scan de l'image (CRITICAL bloquant, HIGH/MEDIUM informatif), comme pipeline.yml
  # ---------------------------------------------------------------------------

  scan-image:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      id-token: write
    env:
      ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
    steps:
      - name: Authenticate to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to the Azure Container Registry
        run: |
          TOKEN=$(az acr login --name "${ACR_LOGIN_SERVER%%.*}" --expose-token --output tsv --query accessToken)
          echo "::add-mask::${TOKEN}"
          echo "${TOKEN}" | docker login "${ACR_LOGIN_SERVER}" \
            --username 00000000-0000-0000-0000-000000000000 --password-stdin

      - name: Compute scan ref
        run: echo "SCAN_REF=${ACR_LOGIN_SERVER}/${{ inputs.app_name }}:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Pull image
        run: docker pull "$SCAN_REF"

      - name: Scan image — CRITICAL (blocking)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:/workspace" \
            aquasec/trivy:latest image \
            --severity CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --format table \
            --output /workspace/trivy-report.txt \
            "$SCAN_REF"
          cat trivy-report.txt

      - name: Scan image — HIGH/MEDIUM (non-blocking)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,MEDIUM \
            --exit-code 0 \
            --ignore-unfixed \
            --format table \
            "$SCAN_REF" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Stage: push — supprime de l'ACR l'image qui a échoué au scan (rôle AcrDelete de la CI)
  # ---------------------------------------------------------------------------

  cleanup-on-scan-failure:
    runs-on: ubuntu-latest
    needs: [scan-image]
    if: ${{ always() && needs.scan-image.result == 'failure' }}
    permissions:
      id-token: write
    steps:
      - name: Authenticate to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Remove vulnerable image from the Azure Container Registry
        env:
          ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
          APP_NAME: ${{ inputs.app_name }}
          TAG: ${{ github.sha }}
        run: |
          echo "[cleanup] image to remove: ${ACR_LOGIN_SERVER}/${APP_NAME}:${TAG}"
          if az acr repository delete --name "${ACR_LOGIN_SERVER%%.*}" --image "${APP_NAME}:${TAG}" --yes; then
            echo "[cleanup] deleted"
          else
            echo "[cleanup] WARNING: delete returned non-zero — image may not exist or was already removed"
          fi

  # ---------------------------------------------------------------------------
  # Stage: push — mise à jour GitOps du claim ContainerApp (automatique sur main)
  #
  # Format À PLAT, comme les apps GCP du portail (ex. app4-pixelcam) : le claim se trouve dans
  # apps/<app>/crossplane/ (un fichier par ressource, kind ContainerApp), repris par l'ApplicationSet
  # cloudrun-autodiscovery. Un seul environnement pour l'instant : le découpage dev/prod viendra avec
  # les ApplicationSets dev/prod (travail en cours dans l'équipe).
  #
  # L'image est mise à jour avec yq et non sed (cf. ANALYSE.md). Si aucun claim ContainerApp n'est
  # trouvé, le job ÉCHOUE avec un message : un pipeline vert qui ne déploie rien serait pire.
  # ---------------------------------------------------------------------------

  update-config:
    runs-on: ubuntu-latest
    needs: [scan-image]
    if: ${{ github.ref == 'refs/heads/main' && needs.scan-image.result == 'success' }}
    permissions:
      contents: read
    steps:
      - name: Promote
        env:
          CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
          CONFIG_REPO_URL: ${{ inputs.config_repo_url }}
          APP_NAME: ${{ inputs.app_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
        run: |
          set -euo pipefail
          for var in CONFIG_REPO_TOKEN COMMIT_SHA APP_NAME CONFIG_REPO_URL ACR_LOGIN_SERVER; do
            eval "val=\$$var"
            if [ -z "$val" ]; then
              echo "[update-config] ERROR: required variable '$var' is not set" >&2
              exit 1
            fi
          done
          command -v yq >/dev/null || { echo "[update-config] ERROR: yq is not available on this runner" >&2; exit 1; }

          git config --global user.email "ci-bot@github.local"
          git config --global user.name "GitHub Actions Bot"

          AUTHED_URL="https://x-access-token:${CONFIG_REPO_TOKEN}@${CONFIG_REPO_URL#https://}"
          git clone --depth=1 "${AUTHED_URL}" config-repo
          cd config-repo

          export PREFIX="${ACR_LOGIN_SERVER}/${APP_NAME}:"
          export IMAGE="${PREFIX}${COMMIT_SHA}"
          DIR="apps/${APP_NAME}/crossplane"
          FOUND=0
          for f in "${DIR}"/*.yaml; do
            [ -f "$f" ] || continue
            grep -q '^kind: ContainerApp$' "$f" || continue
            yq -i '(.spec.forProvider.template.container[] | select(.image | contains(strenv(PREFIX)))).image = strenv(IMAGE)' "$f"
            grep -q "${IMAGE}" "$f" || { echo "[update-config] ERROR: ${f} has no image starting with ${PREFIX}" >&2; exit 1; }
            git add "$f"
            FOUND=$((FOUND + 1))
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "[update-config] ERROR: no ContainerApp claim in ${DIR} for ${PREFIX}*" >&2
            exit 1
          fi

          git commit -m "chore(${APP_NAME}): promote ${COMMIT_SHA:0:7} [ci skip]"

          for attempt in 1 2 3 4 5; do
            if git push "${AUTHED_URL}" HEAD:main; then echo "pushed (attempt $attempt)"; break; fi
            echo "push rejected, rebase + retry $attempt"
            git fetch "${AUTHED_URL}" main
            git rebase FETCH_HEAD || { git rebase --abort; echo "rebase conflict"; exit 1; }
            sleep $((RANDOM % 4 + 2))
            [ "$attempt" = "5" ] && { echo "push failed after 5 attempts"; exit 1; }
          done
