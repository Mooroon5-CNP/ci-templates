# .gitlab-ci.yml — Self-validation pipeline for the ci-templates repository.
#
# Two goals:
#   1. Prove this is an active GitLab CI project (required for the registry
#      and for other projects to reference it via include:project).
#   2. Catch YAML syntax errors and GitLab pipeline validation failures before
#      a broken template reaches consuming application pipelines.
#
# This file intentionally does NOT include pipeline.yml from itself — that
# file uses spec:inputs and requires consumer-supplied values that would make
# self-inclusion circular and impossible to satisfy here.

stages:
  - lint

# ---------------------------------------------------------------------------
# Job 1 — YAML syntax lint
# ---------------------------------------------------------------------------
lint-templates:
  stage: lint
  image:
    name: cytopia/yamllint:latest
    # yamllint ships a real entrypoint; override it so GitLab can inject
    # before_script and run arbitrary shell commands in the container.
    entrypoint: [""]
  script:
    # Lint every template file and the main pipeline entry point.
    # --config-file resolves relative to the repo root where CI clones to.
    - |
      yamllint \
        --config-file .yamllint.yml \
        pipeline.yml \
        templates/.build.yml \
        templates/.scan-secrets.yml \
        templates/.scan-image.yml \
        templates/.cleanup.yml \
        templates/.update-config.yml
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always

# ---------------------------------------------------------------------------
# Job 2 — GitLab CI lint API validation
# ---------------------------------------------------------------------------
# This catches issues that yamllint cannot see: invalid GitLab-specific keys,
# missing required fields, bad stage references, broken include paths, etc.
#
# Auth note: CI_JOB_TOKEN is NOT accepted by the CI lint API. GitLab's job
# token allowlist only covers registry, package, and a few project endpoints.
# Requests with a job token to /api/v4/ci/lint return 404 (GitLab deliberately
# returns 404 instead of 401 for non-allowlisted endpoints). A Personal Access
# Token with read_api scope is required. Store it as a masked CI/CD variable
# named GITLAB_TOKEN at the project or group level.
#
# How to create the token:
#   User Settings → Access Tokens → Add new token
#   Scopes: read_api
#   Store the value in: Settings → CI/CD → Variables → GITLAB_TOKEN (masked)
validate-pipeline-syntax:
  stage: lint
  image: alpine/curl:latest
  before_script:
    - apk add --no-cache jq
  script:
    - |
      # Fail fast with a clear message rather than a confusing 404 if the
      # required PAT was not configured in CI/CD variables.
      if [ -z "$GITLAB_TOKEN" ]; then
        echo "ERROR: GITLAB_TOKEN is not set." >&2
        echo "Create a Personal Access Token (read_api scope) and store it as" >&2
        echo "a masked CI/CD variable named GITLAB_TOKEN." >&2
        exit 1
      fi

      # POST to the global CI lint endpoint (project-scoped endpoint removed
      # in GitLab 16.0). Pass CI_PROJECT_PATH so the API can resolve any
      # include:project references in the YAML being validated.
      # Pipe via stdin to avoid shell-quoting issues with the YAML content.
      HTTP_STATUS=$(
        jq -Rsc --arg project "$CI_PROJECT_PATH" \
             '{"content": ., "project": $project}' \
             pipeline.yml \
          | curl --silent \
              --output /tmp/lint-response.json \
              --write-out "%{http_code}" \
              --request POST \
              --header "Content-Type: application/json" \
              --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
              --data @- \
              "${CI_SERVER_URL}/api/v4/ci/lint"
      )

      echo "HTTP status: ${HTTP_STATUS}"
      echo "CI lint response:"
      jq . /tmp/lint-response.json

      if [ "$HTTP_STATUS" != "200" ]; then
        echo "ERROR: CI lint API returned HTTP ${HTTP_STATUS}" >&2
        exit 1
      fi

      IS_VALID=$(jq -r '.valid' /tmp/lint-response.json)
      if [ "$IS_VALID" != "true" ]; then
        echo ""
        echo "ERROR: pipeline.yml failed GitLab CI validation:" >&2
        jq -r '.errors[]' /tmp/lint-response.json >&2
        exit 1
      fi

      echo "pipeline.yml is valid."
  needs:
    - lint-templates
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
