# .scan-secu.yml — Security scanning before the build (stage: scan-secu).
#
# Two parallel jobs:
#
#   scan-secrets  — Gitleaks scans every commit in the branch for leaked
#                   credentials (API keys, tokens, passwords). Runs on ALL
#                   branches so a secret committed on a feature branch is
#                   caught before it ever reaches main.
#
#   scan-deps     — Trivy scans npm dependencies (package-lock.json) for
#                   known CVEs BEFORE building the image. Catching a
#                   vulnerable package here avoids wasting build time.
#
# Blocking rules (CNP contracts):
#   CRITICAL  → pipeline fails, build is blocked.
#   HIGH/MEDIUM → non-blocking warning printed to job log, pipeline continues.

# ---------------------------------------------------------------------------
# Job: scan-secrets
# ---------------------------------------------------------------------------
.scan-secrets:
  stage: scan-secu
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  variables:
    GITLEAKS_REPORT: gitleaks-report.json
  script:
    - |
      gitleaks detect \
        --source="$CI_PROJECT_DIR" \
        --report-format=json \
        --report-path="${GITLEAKS_REPORT}" \
        --redact \
        --verbose
  artifacts:
    when: always
    paths:
      - $GITLEAKS_REPORT
    expire_in: 7 days
  rules:
    - when: always

# ---------------------------------------------------------------------------
# Job: scan-deps
# ---------------------------------------------------------------------------
.scan-deps:
  stage: scan-secu
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: .trivy-cache
  cache:
    key: trivy-db
    paths:
      - .trivy-cache/
    policy: pull-push
  script:
    - |
      echo "[scan-deps] Scanning npm dependencies for CRITICAL vulnerabilities..."
      trivy fs \
        --cache-dir "${TRIVY_CACHE_DIR}" \
        --scanners vuln \
        --severity CRITICAL \
        --exit-code 1 \
        --ignore-unfixed \
        --format table \
        .

      echo "[scan-deps] Scanning for HIGH/MEDIUM vulnerabilities (non-blocking)..."
      trivy fs \
        --cache-dir "${TRIVY_CACHE_DIR}" \
        --scanners vuln \
        --severity HIGH,MEDIUM \
        --exit-code 0 \
        --ignore-unfixed \
        --format table \
        . || true
  rules:
    - when: always
