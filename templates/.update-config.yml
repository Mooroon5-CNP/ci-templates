# .update-config.yml — Update the Kustomize config repo so ArgoCD picks up the
# new image tag and reconciles the cluster state (stage: push).
#
# Two jobs:
#   update-config-dev   — automatic, runs on every push to main after scan-image
#                         succeeds.
#   update-config-prod  — manual gate, runs on the prod branch; a human must
#                         click "Run" in the GitLab pipeline UI.
#
# Both jobs depend on `scan-image` (via `needs:`). If the image scan fails the
# image is removed by cleanup-on-scan-failure and neither job runs — a
# vulnerable image can never be promoted.
#
# The `git pull --rebase` before push handles the race condition when multiple
# pipelines run concurrently (rapid successive merges to main). Without rebase
# the second push would be rejected as non-fast-forward.
#
# CONFIG_REPO_TOKEN must be a GitLab Project Access Token (or Personal Access
# Token) with `write_repository` scope, stored as a masked CI/CD variable.

# ---------------------------------------------------------------------------
# Job: update-config-dev
# ---------------------------------------------------------------------------
.update-config-dev:
  stage: push
  image:
    name: alpine/git:latest
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  before_script:
    - |
      for var in CONFIG_REPO_TOKEN CI_COMMIT_SHORT_SHA APP_NAME CONFIG_REPO_URL; do
        eval "val=\$$var"
        if [ -z "$val" ]; then
          echo "[update-config-dev] ERROR: required variable '$var' is not set" >&2
          exit 1
        fi
      done
    - git config --global user.email "ci-bot@gitlab.local"
    - git config --global user.name "GitLab CI Bot"
  script:
    - |
      AUTHED_URL=$(echo "${CONFIG_REPO_URL}" | sed "s|https://|https://oauth2:${CONFIG_REPO_TOKEN}@|")
      git clone --depth=1 "${AUTHED_URL}" config-repo
      cd config-repo/apps/${APP_NAME}/overlays/dev

      # Patch newTag in-place. kustomization.yaml must contain a line matching:
      #   newTag: <anything>
      sed -i "s|newTag:.*|newTag: ${CI_COMMIT_SHORT_SHA}|" kustomization.yaml

      git add kustomization.yaml
      git commit -m "chore(${APP_NAME}): promote ${CI_COMMIT_SHORT_SHA} to dev [ci skip]"

      git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
      git push "${AUTHED_URL}" HEAD
  needs:
    - job: scan-image
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success

# ---------------------------------------------------------------------------
# Job: update-config-prod
# ---------------------------------------------------------------------------
.update-config-prod:
  stage: push
  image:
    name: alpine/git:latest
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  before_script:
    - |
      for var in CONFIG_REPO_TOKEN CI_COMMIT_SHORT_SHA APP_NAME CONFIG_REPO_URL; do
        eval "val=\$$var"
        if [ -z "$val" ]; then
          echo "[update-config-prod] ERROR: required variable '$var' is not set" >&2
          exit 1
        fi
      done
    - git config --global user.email "ci-bot@gitlab.local"
    - git config --global user.name "GitLab CI Bot"
  script:
    - |
      AUTHED_URL=$(echo "${CONFIG_REPO_URL}" | sed "s|https://|https://oauth2:${CONFIG_REPO_TOKEN}@|")
      git clone --depth=1 "${AUTHED_URL}" config-repo
      cd config-repo/apps/${APP_NAME}/overlays/prod

      sed -i "s|newTag:.*|newTag: ${CI_COMMIT_SHORT_SHA}|" kustomization.yaml

      git add kustomization.yaml
      git commit -m "chore(${APP_NAME}): promote ${CI_COMMIT_SHORT_SHA} to prod [ci skip]"

      git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
      git push "${AUTHED_URL}" HEAD
  needs:
    - job: scan-image
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
      when: manual
      allow_failure: false
