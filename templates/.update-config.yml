# .update-config.yml — Update the Kustomize config repo so ArgoCD picks up the
# new image tag and reconciles the cluster state (GitOps promotion).
#
# Two jobs cover two promotion paths:
#   update-config-dev   — automatic, runs on every push to main
#   update-config-prod  — manual gate, runs only on the prod branch
#
# The `git pull --rebase` before push handles the race condition that occurs
# when multiple pipelines run concurrently (e.g., rapid successive merges to
# main). Without rebase the second push would be rejected as non-fast-forward.
#
# CONFIG_REPO_TOKEN must be a GitLab Project Access Token (or Personal Access
# Token) with `write_repository` scope, stored as a masked CI/CD variable.
# It must NOT be committed to the repository.

.update-config-dev:
  stage: update-config
  image: alpine/git:latest
  variables:
    APP_NAME: $[[ inputs.app_name ]]
    CONFIG_REPO_URL: $[[ inputs.config_repo_url ]]
    GIT_STRATEGY: none   # We clone the config repo manually; no source checkout needed.
  before_script:
    - |
      for var in CONFIG_REPO_TOKEN CI_COMMIT_SHORT_SHA APP_NAME CONFIG_REPO_URL; do
        eval "val=\$$var"
        if [ -z "$val" ]; then
          echo "[update-config-dev] ERROR: required variable '$var' is not set" >&2
          exit 1
        fi
      done
    # Inject credentials into the clone URL so git can push without a TTY.
    # The token is never echoed because the variable is masked in GitLab.
    - git config --global user.email "ci-bot@gitlab.local"
    - git config --global user.name "GitLab CI Bot"
  script:
    - |
      # Embed token in URL: https://oauth2:<token>@gitlab.example.com/org/config-repo.git
      AUTHED_URL=$(echo "${CONFIG_REPO_URL}" | sed "s|https://|https://oauth2:${CONFIG_REPO_TOKEN}@|")
      git clone --depth=1 "${AUTHED_URL}" config-repo
      cd config-repo/apps/${APP_NAME}/overlays/dev

      # Patch newTag in-place. kustomization.yaml must contain a line matching:
      #   newTag: <anything>
      # The sed expression is POSIX-compatible (no GNU extension required).
      sed -i "s|newTag:.*|newTag: ${CI_COMMIT_SHORT_SHA}|" kustomization.yaml

      git add kustomization.yaml
      git commit -m "chore(${APP_NAME}): promote ${CI_COMMIT_SHORT_SHA} to dev [ci skip]"

      # Rebase against any concurrent updates before pushing.
      git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
      git push "${AUTHED_URL}" HEAD
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success

.update-config-prod:
  stage: update-config
  image: alpine/git:latest
  variables:
    APP_NAME: $[[ inputs.app_name ]]
    CONFIG_REPO_URL: $[[ inputs.config_repo_url ]]
    GIT_STRATEGY: none
  before_script:
    - |
      for var in CONFIG_REPO_TOKEN CI_COMMIT_SHORT_SHA APP_NAME CONFIG_REPO_URL; do
        eval "val=\$$var"
        if [ -z "$val" ]; then
          echo "[update-config-prod] ERROR: required variable '$var' is not set" >&2
          exit 1
        fi
      done
    - git config --global user.email "ci-bot@gitlab.local"
    - git config --global user.name "GitLab CI Bot"
  script:
    - |
      AUTHED_URL=$(echo "${CONFIG_REPO_URL}" | sed "s|https://|https://oauth2:${CONFIG_REPO_TOKEN}@|")
      git clone --depth=1 "${AUTHED_URL}" config-repo
      cd config-repo/apps/${APP_NAME}/overlays/prod

      sed -i "s|newTag:.*|newTag: ${CI_COMMIT_SHORT_SHA}|" kustomization.yaml

      git add kustomization.yaml
      git commit -m "chore(${APP_NAME}): promote ${CI_COMMIT_SHORT_SHA} to prod [ci skip]"

      git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
      git push "${AUTHED_URL}" HEAD
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
      # Explicit human approval required before production promotion.
      when: manual
      allow_failure: false
