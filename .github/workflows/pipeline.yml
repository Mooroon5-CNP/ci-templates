# pipeline.yml — Reusable CI/CD pipeline for the CNP internal platform.
#
# Usage in any application repository:
#
#   jobs:
#     pipeline:
#       uses: Mooroon5-CNP/ci-templates/.github/workflows/pipeline.yml@main
#       with:
#         app_name: "my-app"
#         app_port: "3000"
#         target_cloud: "both"          # gcp | aws | both (default)
#         config_repo_url: "https://github.com/Mooroon5-CNP/config-repo"
#       secrets:
#         CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
#
# The calling workflow must grant:
#   permissions:
#     id-token: write   # required for OIDC token exchange with GCP WIF and AWS
#     contents: read

name: CNP Application Pipeline

on:
  workflow_call:
    inputs:
      app_name:
        type: string
        required: true
        description: "Application name — used as image name and Cloud Run claim directory"
      app_port:
        type: string
        required: false
        default: "8080"
        description: "Port the application listens on inside the container"
      config_repo_url:
        type: string
        required: true
        description: "HTTPS URL of the GitOps config repository"
      target_cloud:
        type: string
        required: false
        default: "both"
        description: "Target container registry: gcp | aws | both"
    secrets:
      CONFIG_REPO_TOKEN:
        required: true
        description: "PAT with write access to the config repository"

jobs:

  # ---------------------------------------------------------------------------
  # Stage: detect — figure out which language runs in front/, back/, or at the
  # repo root, so lint/test know which toolchain to use. Repos without a
  # front/back split (e.g. cnp-portal today) fall back to root detection —
  # this keeps every existing onboarded app working unchanged.
  #
  # To support an additional language: add one more `elif` branch in
  # detect_lang() below, plus the matching setup/lint/test steps in the
  # "lint" and "test" jobs (search for the language name, e.g. "python").
  # ---------------------------------------------------------------------------

  detect-stack:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: detect
        run: |
          detect_lang() {
            local dir="$1"
            if   [ -f "$dir/package.json" ]; then echo "node"
            elif [ -f "$dir/requirements.txt" ] || [ -f "$dir/pyproject.toml" ]; then echo "python"
            elif [ -f "$dir/go.mod" ]; then echo "go"
            elif [ -f "$dir/pom.xml" ] || [ -f "$dir/build.gradle" ] || [ -f "$dir/build.gradle.kts" ]; then echo "java"
            elif [ -f "$dir/CMakeLists.txt" ]; then echo "cpp"
            else echo ""
            fi
          }

          targets="[]"
          add_target() {
            local path="$1" name="$2" lang="$3"
            if [ -z "$lang" ]; then
              echo "::warning::No recognized language found in '$path' — skipping lint/test for it."
              return
            fi
            targets=$(echo "$targets" | jq -c --arg path "$path" --arg name "$name" --arg lang "$lang" \
              '. + [{"path":$path,"name":$name,"lang":$lang}]')
          }

          if [ -d "front" ] || [ -d "back" ]; then
            [ -d "front" ] && add_target "front" "front" "$(detect_lang front)"
            [ -d "back" ]  && add_target "back"  "back"  "$(detect_lang back)"
          else
            add_target "." "root" "$(detect_lang .)"
          fi

          echo "Detected targets: $targets"
          echo "matrix={\"include\":$targets}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Stage: lint — parallel (one job per detected target, plus Dockerfile lint)
  # ---------------------------------------------------------------------------

  lint:
    runs-on: ubuntu-latest
    needs: [detect-stack]
    if: success() && needs.detect-stack.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-stack.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        if: matrix.lang == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Setup Python
        if: matrix.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        if: matrix.lang == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Java
        if: matrix.lang == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Lint (node — ESLint)
        if: matrix.lang == 'node'
        working-directory: ${{ matrix.path }}
        run: |
          if [ ! -f package-lock.json ]; then
            echo "[lint:${{ matrix.name }}] ERROR: package-lock.json not found." >&2
            echo "[lint:${{ matrix.name }}] Run 'npm install' locally and commit the lockfile." >&2
            exit 1
          fi
          npm ci --prefer-offline
          if ! npm run lint -- --help > /dev/null 2>&1; then
            if ! npx --no-install eslint --version > /dev/null 2>&1; then
              echo "[lint:${{ matrix.name }}] ERROR: eslint not found in node_modules." >&2
              exit 1
            fi
          fi
          npm run lint

      - name: Lint (python — flake8)
        if: matrix.lang == 'python'
        working-directory: ${{ matrix.path }}
        run: |
          pip install --quiet flake8
          flake8 .

      - name: Lint (go — go vet)
        if: matrix.lang == 'go'
        working-directory: ${{ matrix.path }}
        run: go vet ./...

      - name: Lint (java — Maven compile)
        if: matrix.lang == 'java' && hashFiles(format('{0}/pom.xml', matrix.path)) != ''
        working-directory: ${{ matrix.path }}
        run: mvn -q -B compile

      - name: Lint (java — Gradle compile)
        if: matrix.lang == 'java' && hashFiles(format('{0}/pom.xml', matrix.path)) == ''
        working-directory: ${{ matrix.path }}
        run: |
          chmod +x ./gradlew
          ./gradlew compileJava

      - name: Lint (cpp — cppcheck)
        if: matrix.lang == 'cpp'
        working-directory: ${{ matrix.path }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck
          cppcheck --error-exitcode=1 --quiet .

  lint-hadolint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        run: |
          if [ ! -f Dockerfile ]; then
            echo "[lint-hadolint] ERROR: Dockerfile not found at repository root." >&2
            exit 1
          fi
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            hadolint/hadolint:latest-alpine \
            hadolint Dockerfile

  # ---------------------------------------------------------------------------
  # Stage: test — parallel (one job per detected target)
  # ---------------------------------------------------------------------------

  test:
    runs-on: ubuntu-latest
    needs: [detect-stack, lint, lint-hadolint]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-stack.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        if: matrix.lang == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Setup Python
        if: matrix.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        if: matrix.lang == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Java
        if: matrix.lang == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Test (node)
        if: matrix.lang == 'node'
        working-directory: ${{ matrix.path }}
        run: |
          npm ci --prefer-offline
          npm test

      - name: Test (python)
        if: matrix.lang == 'python'
        working-directory: ${{ matrix.path }}
        run: |
          [ -f requirements.txt ] && pip install --quiet -r requirements.txt
          pip install --quiet pytest
          pytest --junitxml=test-results.xml

      - name: Test (go)
        if: matrix.lang == 'go'
        working-directory: ${{ matrix.path }}
        run: go test ./...

      - name: Test (java — Maven)
        if: matrix.lang == 'java' && hashFiles(format('{0}/pom.xml', matrix.path)) != ''
        working-directory: ${{ matrix.path }}
        run: mvn -q -B test

      - name: Test (java — Gradle)
        if: matrix.lang == 'java' && hashFiles(format('{0}/pom.xml', matrix.path)) == ''
        working-directory: ${{ matrix.path }}
        run: |
          chmod +x ./gradlew
          ./gradlew test

      - name: Test (cpp — CMake + CTest)
        if: matrix.lang == 'cpp'
        working-directory: ${{ matrix.path }}
        run: |
          cmake -B build
          cmake --build build
          ctest --test-dir build --output-on-failure

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.name }}
          path: ${{ matrix.path }}/test-results.xml
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Stage: scan-secu — parallel
  # ---------------------------------------------------------------------------

  scan-secrets:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source="/repo" \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --redact \
            --verbose

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7

  scan-deps:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Scan deps — CRITICAL (blocking)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            aquasec/trivy:latest fs \
            --scanners vuln \
            --severity CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --format table \
            /workspace

      - name: Scan deps — HIGH/MEDIUM (non-blocking)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            aquasec/trivy:latest fs \
            --scanners vuln \
            --severity HIGH,MEDIUM \
            --exit-code 0 \
            --ignore-unfixed \
            --format table \
            /workspace || true

  # ---------------------------------------------------------------------------
  # Stage: build
  # ---------------------------------------------------------------------------

  build:
    runs-on: ubuntu-latest
    needs: [scan-secrets, scan-deps]
    # id-token: write lets the runner obtain a short-lived OIDC token from GitHub,
    # which google-github-actions/auth exchanges for a GCP access token via WIF,
    # and aws-actions/configure-aws-credentials exchanges for AWS STS credentials.
    # No long-lived key is stored anywhere.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        if: inputs.target_cloud != 'aws'
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
          token_format: access_token

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate Docker to Artifact Registry
        if: inputs.target_cloud != 'aws'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Authenticate to AWS via OIDC
        if: inputs.target_cloud != 'gcp'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::562346647831:role/github-ecr-push-role
          aws-region: eu-west-3

      - name: ECR login + ensure repo
        if: inputs.target_cloud != 'gcp'
        run: |
          aws ecr describe-repositories --repository-names "${{ inputs.app_name }}" --region eu-west-3 \
            || aws ecr create-repository --repository-name "${{ inputs.app_name }}" --region eu-west-3
          aws ecr get-login-password --region eu-west-3 \
            | docker login --username AWS --password-stdin "562346647831.dkr.ecr.eu-west-3.amazonaws.com"

      - name: Compute image refs
        run: |
          TARGET_CLOUD="${{ inputs.target_cloud }}"
          GCP_REGISTRY="${{ vars.REGISTRY_URL }}"
          ECR_REGISTRY="562346647831.dkr.ecr.eu-west-3.amazonaws.com"
          IMAGE_REF=""
          CACHE_REF=""
          ECR_REF=""
          tags=()

          if [ "$TARGET_CLOUD" != "aws" ]; then
            IMAGE_REF="${GCP_REGISTRY}/${{ inputs.app_name }}:${{ github.sha }}"
            CACHE_REF="${GCP_REGISTRY}/cache:${{ inputs.app_name }}"
            tags+=("$IMAGE_REF")
          fi

          if [ "$TARGET_CLOUD" != "gcp" ]; then
            ECR_REF="${ECR_REGISTRY}/${{ inputs.app_name }}:${{ github.sha }}"
            tags+=("$ECR_REF")
          fi

          {
            echo "IMAGE_REF=${IMAGE_REF}"
            echo "CACHE_REF=${CACHE_REF}"
            echo "ECR_REF=${ECR_REF}"
            echo "TAGS<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.TAGS }}
          build-args: APP_PORT=${{ inputs.app_port }}
          cache-from: ${{ env.CACHE_REF && format('type=registry,ref={0}', env.CACHE_REF) || '' }}
          cache-to: ${{ env.CACHE_REF && format('type=registry,ref={0},mode=max', env.CACHE_REF) || '' }}

  # ---------------------------------------------------------------------------
  # Stage: push — scan image
  # ---------------------------------------------------------------------------

  scan-image:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      id-token: write
    steps:
      - name: Authenticate to Google Cloud via Workload Identity Federation
        if: inputs.target_cloud != 'aws'
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
          token_format: access_token

      - name: Authenticate Docker to Artifact Registry
        if: inputs.target_cloud != 'aws'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Authenticate to AWS via OIDC
        if: inputs.target_cloud != 'gcp'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::562346647831:role/github-ecr-push-role
          aws-region: eu-west-3

      - name: ECR login
        if: inputs.target_cloud != 'gcp'
        run: |
          aws ecr get-login-password --region eu-west-3 \
            | docker login --username AWS --password-stdin "562346647831.dkr.ecr.eu-west-3.amazonaws.com"

      - name: Compute scan ref
        run: |
          TARGET_CLOUD="${{ inputs.target_cloud }}"
          GCP_REGISTRY="${{ vars.REGISTRY_URL }}"
          ECR_REGISTRY="562346647831.dkr.ecr.eu-west-3.amazonaws.com"
          if [ "$TARGET_CLOUD" != "aws" ]; then
            SCAN_REF="${GCP_REGISTRY}/${{ inputs.app_name }}:${{ github.sha }}"
          else
            SCAN_REF="${ECR_REGISTRY}/${{ inputs.app_name }}:${{ github.sha }}"
          fi
          echo "SCAN_REF=${SCAN_REF}" >> "$GITHUB_ENV"

      - name: Pull image
        run: docker pull "$SCAN_REF"

      - name: Scan image — CRITICAL (blocking)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:/workspace" \
            aquasec/trivy:latest image \
            --severity CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --format table \
            --output /workspace/trivy-report.txt \
            "$SCAN_REF"
          cat trivy-report.txt

      - name: Scan image — HIGH/MEDIUM (non-blocking)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,MEDIUM \
            --exit-code 0 \
            --ignore-unfixed \
            --format table \
            "$SCAN_REF" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Stage: push — cleanup on scan failure
  # ---------------------------------------------------------------------------

  cleanup-on-scan-failure:
    runs-on: ubuntu-latest
    needs: [scan-image]
    if: ${{ always() && needs.scan-image.result == 'failure' }}
    permissions:
      id-token: write
    steps:
      - name: Authenticate to Google Cloud via Workload Identity Federation
        if: inputs.target_cloud != 'aws'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Remove vulnerable image from Artifact Registry
        if: inputs.target_cloud != 'aws'
        env:
          APP_NAME: ${{ inputs.app_name }}
          TAG: ${{ github.sha }}
        run: |
          IMAGE="${{ vars.REGISTRY_URL }}/${APP_NAME}:${TAG}"
          echo "[cleanup] image to remove: ${IMAGE}"

          if gcloud artifacts docker images delete "${IMAGE}" --quiet; then
            echo "[cleanup] ${IMAGE} deleted"
          else
            echo "[cleanup] WARNING: delete returned non-zero — image may not exist or was already removed"
          fi

      - name: Authenticate to AWS via OIDC
        if: inputs.target_cloud != 'gcp'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::562346647831:role/github-ecr-push-role
          aws-region: eu-west-3

      - name: Remove vulnerable image from ECR
        if: inputs.target_cloud != 'gcp'
        run: |
          aws ecr batch-delete-image \
            --repository-name "${{ inputs.app_name }}" \
            --image-ids imageTag="${{ github.sha }}" \
            --region eu-west-3

  # ---------------------------------------------------------------------------
  # Stage: push — GitOps config update (dev, auto on main)
  # ---------------------------------------------------------------------------

  update-config-dev:
    runs-on: ubuntu-latest
    needs: [scan-image]
    if: ${{ github.ref == 'refs/heads/main' && needs.scan-image.result == 'success' && inputs.target_cloud != 'aws' }}
    permissions:
      contents: read
    steps:
      - name: Promote to dev
        env:
          CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
          CONFIG_REPO_URL: ${{ inputs.config_repo_url }}
          APP_NAME: ${{ inputs.app_name }}
          COMMIT_SHA: ${{ github.sha }}
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
        run: |
          for var in CONFIG_REPO_TOKEN COMMIT_SHA APP_NAME CONFIG_REPO_URL; do
            eval "val=\$$var"
            if [ -z "$val" ]; then
              echo "[update-config-dev] ERROR: required variable '$var' is not set" >&2
              exit 1
            fi
          done

          git config --global user.email "ci-bot@github.local"
          git config --global user.name "GitHub Actions Bot"

          AUTHED_URL="https://x-access-token:${CONFIG_REPO_TOKEN}@${CONFIG_REPO_URL#https://}"
          git clone --depth=1 "${AUTHED_URL}" config-repo
          cd config-repo

          # Update Kustomize overlay newTag for dev environment
          sed -i "s|newTag:.*|newTag: ${COMMIT_SHA}|" \
            "apps/${APP_NAME}/overlays/dev/kustomization.yaml"

          # Update Crossplane claim (if it exists)
          if [ -f "apps/${APP_NAME}/crossplane/cloudrun-claim.yaml" ]; then
            sed -i -E \
              "s|(${REGISTRY_URL}/${APP_NAME}):[^\"]*|\1:${COMMIT_SHA}|" \
              "apps/${APP_NAME}/crossplane/cloudrun-claim.yaml"
            git add "apps/${APP_NAME}/crossplane/cloudrun-claim.yaml"
          fi

          git add "apps/${APP_NAME}/overlays/dev/kustomization.yaml"
          git commit -m "chore(${APP_NAME}): promote ${COMMIT_SHA:0:7} to dev [ci skip]"

          for attempt in 1 2 3 4 5; do
            if git push "${AUTHED_URL}" HEAD:main; then echo "pushed (attempt $attempt)"; break; fi
            echo "push rejected, rebase + retry $attempt"
            git fetch "${AUTHED_URL}" main
            git rebase FETCH_HEAD || { git rebase --abort; echo "rebase conflict"; exit 1; }
            sleep $((RANDOM % 4 + 2))
            [ "$attempt" = "5" ] && { echo "push failed after 5 attempts"; exit 1; }
          done

  # ---------------------------------------------------------------------------
  # Stage: push — GitOps config update (prod, manual via environment protection)
  # ---------------------------------------------------------------------------

  update-config-prod:
    runs-on: ubuntu-latest
    needs: [scan-image]
    if: ${{ github.ref == 'refs/heads/prod' && needs.scan-image.result == 'success' && inputs.target_cloud != 'aws' }}
    environment: production
    permissions:
      contents: read
    steps:
      - name: Promote to prod
        env:
          CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
          CONFIG_REPO_URL: ${{ inputs.config_repo_url }}
          APP_NAME: ${{ inputs.app_name }}
          COMMIT_SHA: ${{ github.sha }}
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
        run: |
          for var in CONFIG_REPO_TOKEN COMMIT_SHA APP_NAME CONFIG_REPO_URL; do
            eval "val=\$$var"
            if [ -z "$val" ]; then
              echo "[update-config-prod] ERROR: required variable '$var' is not set" >&2
              exit 1
            fi
          done

          git config --global user.email "ci-bot@github.local"
          git config --global user.name "GitHub Actions Bot"

          AUTHED_URL="https://x-access-token:${CONFIG_REPO_TOKEN}@${CONFIG_REPO_URL#https://}"
          git clone --depth=1 "${AUTHED_URL}" config-repo
          cd config-repo

          # Update Kustomize overlay newTag for prod environment
          sed -i "s|newTag:.*|newTag: ${COMMIT_SHA}|" \
            "apps/${APP_NAME}/overlays/prod/kustomization.yaml"

          # Update Crossplane claim (if it exists)
          if [ -f "apps/${APP_NAME}/crossplane/cloudrun-claim.yaml" ]; then
            sed -i -E \
              "s|(${REGISTRY_URL}/${APP_NAME}):[^\"]*|\1:${COMMIT_SHA}|" \
              "apps/${APP_NAME}/crossplane/cloudrun-claim.yaml"
            git add "apps/${APP_NAME}/crossplane/cloudrun-claim.yaml"
          fi

          git add "apps/${APP_NAME}/overlays/prod/kustomization.yaml"
          git commit -m "chore(${APP_NAME}): promote ${COMMIT_SHA:0:7} to prod [ci skip]"

          git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
          git push "${AUTHED_URL}" HEAD

  # ---------------------------------------------------------------------------
  # Stage: push — GitOps config update (App Runner / AWS runtime)
  # ---------------------------------------------------------------------------

  update-config-aws:
    runs-on: ubuntu-latest
    needs: [scan-image]
    if: ${{ github.ref == 'refs/heads/main' && needs.scan-image.result == 'success' && inputs.target_cloud != 'gcp' }}
    permissions:
      contents: read
    steps:
      - name: Promote to ECS Fargate
        env:
          CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
          CONFIG_REPO_URL: ${{ inputs.config_repo_url }}
          APP_NAME: ${{ inputs.app_name }}
          COMMIT_SHA: ${{ github.sha }}
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
        run: |
          for var in CONFIG_REPO_TOKEN COMMIT_SHA APP_NAME CONFIG_REPO_URL; do
            eval "val=\$$var"
            if [ -z "$val" ]; then
              echo "[update-config-aws] ERROR: required variable '$var' is not set" >&2
              exit 1
            fi
          done

          git config --global user.email "ci-bot@github.local"
          git config --global user.name "GitHub Actions Bot"

          AUTHED_URL="https://x-access-token:${CONFIG_REPO_TOKEN}@${CONFIG_REPO_URL#https://}"
          git clone --depth=1 "${AUTHED_URL}" config-repo
          cd config-repo

          TASKDEF="apps/${APP_NAME}/crossplane/ecs-task-definition.yaml"
          SERVICE="apps/${APP_NAME}/crossplane/ecs-service.yaml"
          [ -f "$TASKDEF" ] || { echo "[update-config-aws] no ecs-task-definition.yaml, skip"; exit 0; }
          command -v yq >/dev/null || { echo "yq manquant"; exit 1; }

          NEW_NAME="${APP_NAME}-${COMMIT_SHA:0:7}"

          yq -i ".metadata.name = \"${NEW_NAME}\"" "$TASKDEF"
          sed -i -E "s|(dkr\.ecr\.eu-west-3\.amazonaws\.com/${APP_NAME}):[^\"[:space:]]*|\1:${COMMIT_SHA}|" "$TASKDEF"
          yq -i ".spec.forProvider.taskDefinitionRef.name = \"${NEW_NAME}\"" "$SERVICE"

          git add "$TASKDEF" "$SERVICE"
          git commit -m "chore(${APP_NAME}): promote ${COMMIT_SHA:0:7} to ECS Fargate [ci skip]"

          for attempt in 1 2 3 4 5; do
            if git push "${AUTHED_URL}" HEAD:main; then echo "pushed (attempt $attempt)"; break; fi
            echo "push rejected, rebase + retry $attempt"
            git fetch "${AUTHED_URL}" main
            git rebase FETCH_HEAD || { git rebase --abort; echo "rebase conflict"; exit 1; }
            sleep $((RANDOM % 4 + 2))
            [ "$attempt" = "5" ] && { echo "push failed after 5 attempts"; exit 1; }
          done
